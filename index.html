<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YSAI</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000000;
    background-image:
      linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
    background-size: 48px 48px;
    font-family: 'Segoe UI', system-ui, sans-serif;
  }

  .logo-wrap {
    text-align: center;
  }

  .logo {
    font-size: clamp(3rem, 12vw, 7rem);
    font-weight: 800;
    letter-spacing: 0.05em;
    color: #f5f1e8;
    text-shadow: 0 0 30px rgba(245, 241, 232, 0.15);
  }

  .logo span {
    color: #c9a9e9;
    text-shadow: 0 0 30px rgba(201, 169, 233, 0.35);
  }

  .tagline {
    margin-top: 1.25rem;
    font-size: 0.9rem;
    letter-spacing: 0.4em;
    text-transform: uppercase;
    color: #8a8580;
  }

  .tagline .accent {
    color: #c9a9e9;
  }
</style>
</head>
<body>
  <div class="logo-wrap">
    <div class="logo">YS<span>AI</span></div>
    <div class="tagline">TRANSFORM <span class="accent">·</span> ORCHESTRATE <span class="accent">·</span> SCALE</div>
  </div>
</body>
</html>
